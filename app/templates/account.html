{% extends 'base.html' %}{% block title %}Account | Paisa{% endblock %}{% block content %}<section class="page-heading compact"><div><p class="eyebrow">Your details</p><h1>Account</h1><p class="muted">Keep your profile and sign-in details up to date.</p></div></section><section class="account-grid"><form method="post" class="panel form-panel account-panel"><div><p class="eyebrow">Profile</p><h2>Personal details</h2></div><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="name"><label>Name<input type="text" name="name" value="{{ current_user.name }}" required autocomplete="name"></label><label>Email<input type="email" value="{{ current_user.email }}" disabled></label><button class="button primary" type="submit">Save name</button></form><form method="post" class="panel form-panel account-panel"><div><p class="eyebrow">Security</p><h2>Change password</h2></div><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="password"><label>Current password<input type="password" name="current_password" required autocomplete="current-password"></label><label>New password<input type="password" name="new_password" required minlength="8" autocomplete="new-password"></label><label>Confirm new password<input type="password" name="confirm_password" required minlength="8" autocomplete="new-password"></label><button class="button primary" type="submit">Update password</button></form></section>{% endblock %}
